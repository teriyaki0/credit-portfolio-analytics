# Публикует статичный дашборд (dashboard/) на GitHub Pages при каждом push в main.
# Данные — уже выгруженные и сверенные dashboard/data/*.json; база для показа не нужна.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Собрать сайт из dashboard/ (без конфига nginx)
        run: |
          mkdir _site
          cp -r dashboard/index.html dashboard/quality.html dashboard/charts.js \
                dashboard/css dashboard/specs dashboard/data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
