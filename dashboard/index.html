<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Риск-сводка портфеля</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/vega@5.30.0/build/vega.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.21.0/build/vega-lite.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.26.0/build/vega-embed.min.js"></script>
  <script src="charts.js"></script>
</head>

<body>
  <header>
    <div class="head">
      <div class="eyebrow">Кредитный портфель</div>
      <h1 id="title">Риск-сводка портфеля</h1>
      <p class="period" id="period"></p>
    </div>
  </header>

  <main>
    <section class="card">
      <div id="kpi" class="chart"></div>
      <p class="footnote" id="kpi-note" hidden></p>
    </section>

    <div class="grid-2">
      <section class="card">
        <div id="overdue" class="chart"></div>
      </section>
      <section class="card">
        <div id="concentration" class="chart"></div>
        <details>
          <summary>Таблица</summary>
          <div id="concentration-table"></div>
        </details>
      </section>
    </div>

    <section class="card">
      <div id="migration" class="chart"></div>
    </section>

    <section class="card">
      <div id="by-sector" class="chart"></div>
      <details>
        <summary>Таблица</summary>
        <div id="by-sector-table"></div>
      </details>
    </section>

    <section class="card">
      <div id="by-program" class="chart"></div>
      <details>
        <summary>Таблица</summary>
        <div id="by-program-table"></div>
      </details>
    </section>

    <footer>
      Как считались и проверялись цифры — <a href="quality.html">качество данных и сверка</a>; определения — в README.
      Данные — выгрузка вьюх <code>reporting.*</code> после пройденных проверок, спеки — <code>dashboard/specs/</code>.
    </footer>
  </main>

  <script>
    const SPECS = [
      ["kpi", "specs/kpi.json"], ["overdue", "specs/overdue.json"], ["concentration", "specs/concentration.json"],
      ["migration", "specs/migration.json"], ["by-sector", "specs/by_sector.json"], ["by-program", "specs/by_program.json"],
    ];

    async function renderText() {
      const [metrics, segments, groups, quality] = await Promise.all([
        json("data/risk_metrics.json"), json("data/risk_by_segment.json"),
        json("data/top_groups.json"), json("data/data_quality.json"),
      ]);
      const { last } = lastDates(metrics);
      document.getElementById("title").textContent = reportTitle(metrics);
      document.getElementById("period").textContent = periodText(metrics);

      for (const type of ["sector", "program"]) {
        const rows = segments.filter((s) => s.segment_type === type)
          .sort((a, b) => a.segment.localeCompare(b.segment, "ru") || a.report_date.localeCompare(b.report_date));
        document.getElementById(`by-${type}-table`).innerHTML = table(rows, [
          { title: type === "sector" ? "Отрасль" : "Программа", value: (r) => r.segment },
          { title: "Дата", value: (r) => ruDate(r.report_date) },
          { title: "Портфель, млрд ₸", num: true, value: (r) => bn(r.portfolio_kzt) },
          { title: "PAR30", num: true, value: (r) => pct(r.par30_ratio) },
          { title: "PAR90", num: true, value: (r) => pct(r.par90_ratio) },
          { title: "NPL", num: true, value: (r) => pct(r.npl_ratio) },
          { title: "Провизии, млрд ₸", num: true, value: (r) => bn(r.provision_kzt) },
        ]);
      }
      document.getElementById("concentration-table").innerHTML = table(groups.filter((g) => g.report_date === last), [
        { title: "Место", num: true, value: (r) => r.exposure_rank },
        { title: "Группа", value: (r) => r.group_id },
        { title: "Заёмщиков", num: true, value: (r) => r.borrowers },
        { title: "Экспозиция, млрд ₸", num: true, value: (r) => nf(2).format(r.exposure_kzt / 1e9) },
        { title: "Доля портфеля", num: true, value: (r) => pct(r.share) },
      ]);

      // Сноска к KPI: вопросы к данным могут изменить NPL. Мелко, как примечание в отчёте.
      const issues = quality.filter((q) => q.report_date === last && q.loans > 0);
      if (issues.length) {
        const alts = issues.map((q) => q.npl_ratio_alt);
        const note = document.getElementById("kpi-note");
        note.hidden = false;
        note.innerHTML = `Примечание. Показатели посчитаны по данным источника как есть. По части кредитов к источнику ` +
          `есть вопросы; в зависимости от ответов NPL на ${esc(ruDate(last))} может составить ` +
          `от ${esc(pct(Math.min(...alts)))} до ${esc(pct(Math.max(...alts)))}. ` +
          `<a href="quality.html#anomalies">Подробнее о данных</a>`;
      }
    }

    const render = () => renderCharts(SPECS);
    render();
    renderText().catch((e) => { document.getElementById("period").textContent = "Не удалось загрузить данные: " + e.message; });
    let timer;
    addEventListener("resize", () => { clearTimeout(timer); timer = setTimeout(render, 250); });
  </script>
</body>

</html>
